<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sahara Shield | Dashboard</title>
    <link rel="stylesheet" href="/static/css/index.css">
    <script defer src="/static/js/index.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="dashboard" aria-labelledby="dashboard-title">
        <h1 id="dashboard-title">Sahara Shield</h1>
        <p id="welcome-message" class="welcome"></p>

        <div id="apps-container" class="apps-container">
          <h2>Your Protected Apps</h2>
          <div id="apps-list" class="apps-list"></div>
          <p id="no-apps-message" class="info-message"></p>
          <p id="error-message" class="error" role="alert" aria-live="polite"></p>
        </div>
      </section>
    </main>
  </body>
</html>
