<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sahara Shield | Create Protected App</title>
    <link rel="stylesheet" href="/static/css/create_protected_app.css">
    <script defer src="/static/js/create_protected_app.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="create-app-card" aria-labelledby="create-app-title">
        <a href="/" class="back-link">← Back to Apps</a>
        <p class="page-kicker">Protected App</p>
        <h1 id="create-app-title">Create a New Protected App</h1>
        <p class="subtitle">Enter the app details and save them to your dashboard.</p>

        <form id="create-protected-app-form" class="create-app-form">
          <label>
            <span>Name</span>
            <input id="name" name="name" type="text" autocomplete="organization" required>
          </label>

          <label>
            <span>URL</span>
            <input id="url" name="url" type="url" placeholder="https://example.com" required>
          </label>

          <div class="field-grid">
            <label>
              <span>Severity Weight</span>
              <input
                id="risk_score_severity_score_weight"
                name="risk_score_severity_score_weight"
                type="number"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                required
              >
            </label>

            <label>
              <span>Confidence Weight</span>
              <input
                id="risk_score_confidence_pct_weight"
                name="risk_score_confidence_pct_weight"
                type="number"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                required
              >
            </label>
          </div>

          <div class="button-row">
            <button type="submit" class="primary-button">Create Protected App</button>
          </div>
        </form>

        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
        <p id="error-message" class="error" role="alert" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
