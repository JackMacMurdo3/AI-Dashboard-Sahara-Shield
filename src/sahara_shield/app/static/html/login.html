<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Malware Detection AI</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="login-page">

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    SAHARA SHIELD
  </div>
  <div class="status-bar">
    <div>ACCESS <span>RESTRICTED</span></div>
  </div>
</header>

<main class="login-shell">
  <div class="card login-card">
    <div class="section-title">Authentication</div>
    <div class="login-title">Sign In</div>
    <div class="login-subtitle">Enter your credentials to access the dashboard.</div>

    <form id="login-form" class="login-form" novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="analyst@company.com" />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password" />
      </div>

      <button type="submit" class="find-malware-btn">Login</button>
      <div id="login-msg" class="login-msg" aria-live="polite"></div>
    </form>
  </div>
</main>

<script src="/static/js/login.js"></script>
</body>
</html>
